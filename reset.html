<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nueva contraseña · Cyber Quack Rehab</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="css/estilos.css" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0b3d4a" />
<link rel="icon" type="image/png" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<style>
  .login-box{ gap: 14px; }
  .reset-logo{ width: 96px; height: 96px; border-radius: 20px; display: block; margin: 0 auto; }
  h1{ margin: 0; text-align: center; font-size: 24px; color: var(--duck-yellow); font-family: var(--display); }
  .ayuda{ margin: 0; text-align: center; font-size: 16px; line-height: 1.45; color: var(--ink); }
  label{ font-size: 15px; font-weight: 700; color: var(--ink); }
  input{ font-size: 18px; padding: 14px; width: 100%; box-sizing: border-box; }
  .campo{ display: flex; flex-direction: column; gap: 6px; }
  .ver{ display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--ink); cursor: pointer; }
  .ver input{ width: 22px; height: 22px; }
  .btn{ font-size: 17px; padding: 14px; width: 100%; }
  .login-error{ font-size: 15px; text-align: center; }
  .ok{ color: #7ee2a8; font-size: 17px; line-height: 1.45; text-align: center; font-weight: 600; }
  .oculto{ display: none !important; }
</style>
</head>
<body>
  <div class="login-box">
    <img class="reset-logo" src="icons/icon-192.png" alt="Cyber Quack Rehab" />
    <h1>Crear contraseña nueva</h1>

    <p id="cargando" class="ayuda">Verificando tu enlace…</p>

    <form id="formReset" class="oculto">
      <p class="ayuda">Escribe tu contraseña nueva dos veces. Debe tener al menos 6 caracteres.</p>
      <div class="campo">
        <label for="pass1">Contraseña nueva</label>
        <input type="password" id="pass1" autocomplete="new-password" required />
      </div>
      <div class="campo">
        <label for="pass2">Repite la contraseña</label>
        <input type="password" id="pass2" autocomplete="new-password" required />
      </div>
      <label class="ver"><input type="checkbox" id="verPass" /> Mostrar contraseña</label>
      <div class="login-error" id="resetError"></div>
      <button type="submit" id="btnGuardar" class="btn primary">Guardar contraseña</button>
    </form>

    <div id="mensajeFinal" class="oculto">
      <p id="textoFinal" class="ok"></p>
      <a href="index.html" class="btn primary" style="display:block; text-align:center; text-decoration:none; box-sizing:border-box;">Ir a iniciar sesión</a>
    </div>
  </div>

<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script>
  // Cliente propio para esta página: lee el enlace del correo y no toca las sesiones de fisio/paciente
  const clienteReset = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { storageKey: 'cqr-sesion-reset', detectSessionInUrl: true, persistSession: true }
  });

  const cargando = document.getElementById('cargando');
  const formReset = document.getElementById('formReset');
  const resetError = document.getElementById('resetError');
  const mensajeFinal = document.getElementById('mensajeFinal');
  const textoFinal = document.getElementById('textoFinal');
  const btnGuardar = document.getElementById('btnGuardar');
  let listo = false;

  function mostrarFormulario(){
    if (listo) return;
    listo = true;
    cargando.classList.add('oculto');
    formReset.classList.remove('oculto');
    document.getElementById('pass1').focus();
  }

  function mostrarFinal(texto, esError){
    cargando.classList.add('oculto');
    formReset.classList.add('oculto');
    mensajeFinal.classList.remove('oculto');
    textoFinal.innerHTML = texto;
    textoFinal.className = esError ? 'login-error' : 'ok';
  }

  // ¿El enlace viene con error? (por ejemplo, ya caducó o ya se usó)
  const params = new URLSearchParams(window.location.hash.slice(1) + '&' + window.location.search.slice(1));
  if (params.get('error') || params.get('error_code')) {
    mostrarFinal('Este enlace ya caducó o ya se usó.<br>Vuelve a la pantalla de inicio, toca <b>“¿Olvidaste tu contraseña?”</b> y pide uno nuevo.', true);
  } else {
    clienteReset.auth.onAuthStateChange((evento, sesion) => {
      if (evento === 'PASSWORD_RECOVERY' || (sesion && evento === 'SIGNED_IN')) mostrarFormulario();
    });
    clienteReset.auth.getSession().then(({ data }) => { if (data.session) mostrarFormulario(); });
    setTimeout(() => {
      if (!listo) mostrarFinal('No pudimos abrir este enlace.<br>Ábrelo directamente desde el correo, o pide uno nuevo en <b>“¿Olvidaste tu contraseña?”</b>.', true);
    }, 6000);
  }

  document.getElementById('verPass').onchange = (e) => {
    const tipo = e.target.checked ? 'text' : 'password';
    document.getElementById('pass1').type = tipo;
    document.getElementById('pass2').type = tipo;
  };

  formReset.addEventListener('submit', async (e) => {
    e.preventDefault();
    resetError.textContent = '';
    const p1 = document.getElementById('pass1').value;
    const p2 = document.getElementById('pass2').value;
    if (p1.length < 6) { resetError.textContent = 'La contraseña debe tener al menos 6 caracteres.'; return; }
    if (p1 !== p2) { resetError.textContent = 'Las dos contraseñas no son iguales. Escríbelas otra vez.'; return; }

    btnGuardar.disabled = true; btnGuardar.textContent = 'Guardando...';
    const { error } = await clienteReset.auth.updateUser({ password: p1 });
    if (error) {
      resetError.textContent = traducirError(error.message);
      btnGuardar.disabled = false; btnGuardar.textContent = 'Guardar contraseña';
      return;
    }
    await clienteReset.auth.signOut({ scope: 'local' });
    history.replaceState(null, '', window.location.pathname);
    mostrarFinal('¡Listo! Tu contraseña se cambió correctamente.<br>Ya puedes iniciar sesión con tu contraseña nueva.', false);
  });
</script>
</body>
</html>
